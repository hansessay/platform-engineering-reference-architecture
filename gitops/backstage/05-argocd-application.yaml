apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: backstage
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/hansessay/platform-engineering-reference-architecture.git
    targetRevision: feature/backstage-sre-idp
    path: gitops/backstage

  destination:
    server: https://kubernetes.default.svc
    namespace: backstage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
