name: Promote Backstage

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Immutable image SHA to promote"
        required: true
        type: string

      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write

jobs:
  promote:
    name: Promote Backstage
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment
        shell: bash
        run: |
          if [[ "${{ inputs.environment }}" != "staging" &&
                "${{ inputs.environment }}" != "production" ]]; then
            exit 1
          fi

      - name: Update GitOps image
        shell: bash
        run: |
          FILE="gitops/${{ inputs.environment }}/backstage/02-backstage-deployment.yaml"

          sed -i \
            "s|ghcr.io/hansessay/sre-backstage:.*|ghcr.io/hansessay/sre-backstage:${{ inputs.image_sha }}|" \
            "$FILE"

          cat "$FILE"

      - name: Commit promotion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/${{ inputs.environment }}/backstage

          git commit \
            -m "promote(backstage): ${{ inputs.image_sha }} to ${{ inputs.environment }}"

          git push