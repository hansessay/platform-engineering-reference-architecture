name: Backstage CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "backstage/sre-platform-portal/**"
      - ".github/workflows/backstage-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backstage/sre-platform-portal/**"
      - ".github/workflows/backstage-ci.yml"

  workflow_dispatch:

jobs:
  build:
    name: Build and Validate Backstage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backstage/sre-platform-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: backstage/sre-platform-portal/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate Backstage configuration
        run: yarn backstage-cli config:check --lax

      - name: Build Backstage
        run: yarn build:backend

      - name: Build Docker image
        run: |
          docker build \
            -f packages/backend/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/sre-backstage:${{ github.sha }} \
            .

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/sre-backstage:${{ github.sha }}