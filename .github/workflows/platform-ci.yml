
name: Platform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Find and validate service Terraform directories
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t directories < <(
            find services \
              -type f \
              -path "*/terraform/*.tf" \
              -not -path "*/.terraform/*" \
              -exec dirname {} \; 2>/dev/null |
              sort -u
          )

          if [ "${#directories[@]}" -eq 0 ]; then
            echo "No service Terraform directories found."
            exit 0
          fi

          for directory in "${directories[@]}"; do
            echo "Formatting ${directory}"
            terraform -chdir="${directory}" fmt -check

            echo "Initializing ${directory}"
            terraform -chdir="${directory}" init \
              -backend=false \
              -input=false

            echo "Validating ${directory}"
            terraform -chdir="${directory}" validate
          done

  terraform-security:
    name: Terraform Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov against GitOps services
        uses: bridgecrewio/checkov-action@master
        with:
          directory: services
          framework: terraform
          quiet: true
          soft_fail: false

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
