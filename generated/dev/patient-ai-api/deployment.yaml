apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-ai-api
  namespace: dev-healthcare
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Image digest is injected by the CI/CD pipeline after the image build"
  labels:
    app: patient-ai-api
    owner: healthcare
    ai-enabled: "True"

spec:
  replicas: 2

  selector:
    matchLabels:
      app: patient-ai-api

  template:
    metadata:
      labels:
        app: patient-ai-api

    spec:
      serviceAccountName: patient-ai-api-sa
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: patient-ai-api
          image: "123456789012.dkr.ecr.eu-north-1.amazonaws.com/patient-ai-api:dev"
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3