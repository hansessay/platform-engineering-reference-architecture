name: Validate and Deploy patient-ai-api

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

env:
  SERVICE_NAME: patient-ai-api
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: 123456789012
  ECR_REPOSITORY: patient-ai-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  security-validation:
    name: Security and configuration validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Run Checkov security scan
        run: |
          checkov \
            --directory . \
            --framework terraform kubernetes \
            --compact \
            --quiet

      - name: Run tests
        run: |
          echo "Running tests for patient-ai-api"

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs:
      - security-validation

    # Never publish images from pull requests.
    # Only publish after code is merged or pushed to main.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::123456789012:role/patient-ai-api-github-actions-role
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Push Docker image to ECR
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG