apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: patient-ai-api
  namespace: dev-healthcare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: patient-ai-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70