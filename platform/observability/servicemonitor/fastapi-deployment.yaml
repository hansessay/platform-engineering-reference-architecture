apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: default
  labels:
    app: platform-api
spec:
  replicas: 1

  selector:
    matchLabels:
      app: platform-api

  template:
    metadata:
      labels:
        app: platform-api

    spec:
      containers:
        - name: platform-api
          image: platform-api:local
          imagePullPolicy: Never

          command:
            - python
            - -m
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"

          ports:
            - name: http
              containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi