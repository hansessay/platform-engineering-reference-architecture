apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceph-storage-demo
  namespace: default
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ceph-storage-demo

  template:
    metadata:
      labels:
        app: ceph-storage-demo

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: storage-demo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                date >> /data/ceph-test.log
                sleep 30
              done

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

          volumeMounts:
            - name: ceph-storage
              mountPath: /data

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: ceph-storage
          persistentVolumeClaim:
            claimName: ceph-block-test