apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph

spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
    allowUnsupported: false

  dataDirHostPath: /var/lib/rook

  mon:
    count: 1
    allowMultiplePerNode: true

  mgr:
    count: 1
    allowMultiplePerNode: true

  dashboard:
    enabled: true
    ssl: true

  monitoring:
    enabled: false

  crashCollector:
    disable: false

  disruptionManagement:
    managePodBudgets: false

  storage:
    useAllNodes: true
    useAllDevices: false
    deviceFilter: "^loop2$"
    