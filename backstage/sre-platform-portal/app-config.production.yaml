app:
  # Public URL used by the browser.
  # Docker exposes localhost:7008 -> container:7007
  baseUrl: http://localhost:7008

backend:
  # Public URL clients use to reach the Backstage backend
  baseUrl: http://localhost:7008

  # Backstage listens on port 7007 inside the container
  listen: ':7007'

  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

# ---------------------------------------------------------
# Authentication
# ---------------------------------------------------------
# LOCAL LAB ONLY.
# Guest authentication must NOT be used for real production.
auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

# ---------------------------------------------------------
# Software Catalog
# ---------------------------------------------------------
catalog:
  locations:

    # Example Backstage entities
    - type: file
      target: ./examples/entities.yaml

    # Example Backstage software template
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    # Example users and groups
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]