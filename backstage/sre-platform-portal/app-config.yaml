app:
  title: SRE Platform IDP
  baseUrl: http://localhost:3000

  packages: all

  extensions:
    - page:catalog:
        config:
          path: /

organization:
  name: SRE Platform Engineering

backend:
  baseUrl: http://localhost:7007

  listen:
    port: 7007

  csp:
    connect-src:
      - "'self'"
      - "http:"
      - "https:"

  cors:
    origin: http://localhost:3000
    methods:
      - GET
      - HEAD
      - PATCH
      - POST
      - PUT
      - DELETE
    credentials: true

  database:
    client: better-sqlite3
    connection: ":memory:"

actions:
  pluginSources:
    - auth
    - catalog
    - scaffolder

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

proxy: {}

techdocs:
  builder: local

  generator:
    runIn: docker

  publisher:
    type: local

auth:
  providers:
    guest: {}

  clientIdMetadataDocuments:
    enabled: false

scaffolder: {}

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration

  rules:
    - allow:
        - Component
        - System
        - API
        - Resource
        - Location
        - User
        - Group
        - Template

  locations:
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow:
            - User
            - Group

    - type: file
      target: ../../catalog/users/platform-team.yaml
      rules:
        - allow:
            - Group

    - type: file
      target: ../../catalog/networking/core-switch-01.yaml
      rules:
        - allow:
            - Resource

    - type: file
      target: ../../catalog/applications/patient-ai-api.yaml
      rules:
        - allow:
            - Component

    - type: file
      target: ../../catalog/applications/backup-api.yaml
      rules:
        - allow:
            - Component

    - type: file
      target: ../../catalog/systems/backup-platform.yaml
      rules:
        - allow:
            - System

    - type: file
      target: ../../catalog/kubernetes/k8s-prod-01.yaml
      rules:
        - allow:
            - Resource

    - type: file
      target: ../../catalog/storage/ceph-prod-01.yaml
      rules:
        - allow:
            - Resource

kubernetes:
  serviceLocatorMethod:
    type: multiTenant

  clusterLocatorMethods:
    - type: config
      clusters:
        - name: sre-lab
          url: https://host.docker.internal:6443
          authProvider: serviceAccount
          skipTLSVerify: true
          serviceAccountToken: ${K8S_SERVICE_ACCOUNT_TOKEN}

permission:
  enabled: true

mcpActions:
  name: SRE Platform Backstage
  description: >
    Tools for managing the software catalog,
    creating services from templates,
    and operating the SRE platform.
